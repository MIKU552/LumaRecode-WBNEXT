# Builds and tests the shared core on every host, then the two delivery targets.
#
# The core job is the gate: format rules, timeline and preset parsing must pass
# on Linux, Windows and macOS before a platform artifact is produced. Hardware
# media tests stay a separate, non-blocking result because a hosted runner does
# not guarantee an encoder.
name: native

on:
  push:
    branches: [next]
    # A documentation-only push cannot change the binaries; the docs workflow
    # checks the Markdown instead of rebuilding everything.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lints have one answer, so they run once. Keeping them out of the
  # matrix also stops a formatting slip from looking like an "Ubuntu-only" failure.
  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V

      - name: Format
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings

  # Tests run on every host because behaviour, path handling and process spawning
  # differ between them. macOS uses the same xcode-27 image as the application job:
  # "macos-latest" queues heavily, and running the core on the target OS is the
  # better trade anyway.
  core:
    name: core (${{ matrix.label }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: xcode-27
            label: macOS 27 (cargo)
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V

      - name: Unit tests
        run: cargo test --manifest-path native/Cargo.toml --workspace

  docs:
    name: documentation
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates parallel language sections, anchors and links for every
      # Markdown file, including the four READMEs this branch renames.
      - name: Documentation checks
        run: python3 qa/DocumentationChecks/check_docs.py

  windows:
    name: windows (${{ matrix.arch }})
    needs: core
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: X64
            arch: x64
            rid: win-x64
            triple: x86_64-pc-windows-msvc
          - target: Arm64
            arch: arm64
            rid: win-arm64
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Add Rust target
        run: rustup target add ${{ matrix.triple }}

      - name: Build native library
        shell: pwsh
        run: |
          $test = '${{ matrix.target }}' -eq 'X64'
          ./tools/Build-Native.ps1 -Configuration Release -Target ${{ matrix.target }} -Test:$test

      - name: Build managed interop
        shell: pwsh
        run: dotnet build Interop/LumaRecode.Native.csproj -c Release -p:LumaRecodeArchitecture=${{ matrix.arch }} --nologo

      - name: Record versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-info -Force | Out-Null
          rustc -Vv | Out-File build-info/rust.txt
          dotnet --version | Out-File build-info/dotnet.txt
          (Get-FileHash "artifacts/native/${{ matrix.arch }}/lumacore.dll" -Algorithm SHA256).Hash |
            Out-File build-info/lumacore.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.arch }}/
            build-info/
          if-no-files-found: error

  macos:
    name: macos 27 (arm64)
    needs: core
    # GitHub names macOS runner images after the Xcode major. The preview image
    # for macOS 27 is published under the label "xcode-27"; its OS is macOS
    # 27.0.1 with Xcode 27.0/27.1/27.2. There is no "macos-27" label yet, and
    # "macos-latest" resolves to macOS 26, which cannot build the 27.0
    # deployment target below. Preview images sit outside the Actions SLA, so
    # move this to the stable label once macOS 27 reaches GA.
    runs-on: xcode-27
    env:
      MACOSX_DEPLOYMENT_TARGET: "27.0"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # The image ships several Xcode builds and defaults to an older one.
          # Select the newest installed major.minor so the app is always built
          # with the latest Swift the image provides; the resolved version is
          # recorded below.
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version
          xcodebuild -version
          rustup show active-toolchain

      - name: Build, test and package
        run: bash app-macos/scripts/build-macos.sh --skip-dmg --test

      - name: Record versions and signature
        run: |
          mkdir -p build-info
          rustc -Vv > build-info/rust.txt
          swift --version > build-info/swift.txt
          codesign --verify --strict --verbose=2 app-macos/dist/LumaRecode.app 2> build-info/codesign.txt
          shasum -a 256 app-macos/dist/LumaRecode.app/Contents/MacOS/LumaRecode > build-info/lumarecode.sha256

      - name: CLI smoke
        run: |
          # The bundle executable doubles as the terminal entry point; run it
          # headless and require the same core line the Windows job checks.
          binary="app-macos/dist/LumaRecode.app/Contents/MacOS/LumaRecode"
          "$binary" --version | tee build-info/cli.txt
          grep -q "core: shared 0.1.0" build-info/cli.txt

      - name: Conversion smoke
        run: |
          # A hosted macOS runner ships no FFmpeg, and the first real conversion needs
          # one. The Homebrew bottle installs in well under a minute on Apple Silicon.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -1
          work="$(mktemp -d)"
          # Two sources: an 8-bit SDR clip, and a 10-bit HLG clip with audio. FFV1 keeps
          # the second independent of whichever encoders the installed FFmpeg ships.
          ffmpeg -v error -f lavfi -i testsrc2=size=320x240:rate=30:duration=2 \
            -c:v libx264 -pix_fmt yuv420p -y "$work/source.mp4"
          ffmpeg -v error -f lavfi -i testsrc2=size=320x240:rate=30:duration=1 \
            -f lavfi -i sine=frequency=440:duration=1 \
            -c:v ffv1 -pix_fmt yuv420p10le -color_primaries bt2020 -color_trc arib-std-b67 \
            -colorspace bt2020nc -c:a pcm_s16le -shortest -y "$work/hlg.mkv"

          binary="app-macos/dist/LumaRecode.app/Contents/MacOS/LumaRecode"
          export LUMARECODE_PRESETS="$GITHUB_WORKSPACE/Assets/recommended-presets.json"
          "$binary" convert "$work/source.mp4" -o "$work/out.mkv" \
            --purpose archive --codec hevc --input-kind sdr
          "$binary" convert "$work/hlg.mkv" -o "$work/hlg-out.mkv" \
            --purpose archive --codec hevc --output hdr --input-kind hlg

          sdr="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of csv=p=0 "$work/out.mkv")"
          hdr="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of csv=p=0 "$work/hlg-out.mkv")"
          echo "sdr: $sdr"
          echo "hdr: $hdr"
          case "$sdr" in
            hevc,yuv420p*) ;;
            *) echo "unexpected SDR output: $sdr" >&2; exit 1 ;;
          esac
          # The 10-bit source must stay 10-bit: an 8-bit result would mean the depth
          # policy was not applied on this platform.
          if [ "$hdr" != "hevc,yuv420p10le" ]; then
            echo "unexpected HDR output: $hdr" >&2
            exit 1
          fi
          printf '%s\n' "$sdr" > build-info/convert-sdr.txt
          printf '%s\n' "$hdr" > build-info/convert-hdr.txt

          # A PQ source that declares its mastering display, in MP4 so the declaration sits
          # in the container where the probe reads it. The output must keep it.
          # The colour tags go into the x265 VUI: written as ffmpeg output options they
          # do not survive into this container, and the probe would read kind "unknown".
          ffmpeg -v error -f lavfi -i testsrc2=size=320x240:rate=30:duration=1 \
            -c:v libx265 -pix_fmt yuv420p10le \
            -x265-params "master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,50):max-cll=1000,400:colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc" \
            -y "$work/pq.mp4"
          # No --input-kind: the source must be recognised as PQ from its own tags.
          "$binary" convert "$work/pq.mp4" -o "$work/pq-out.mkv" \
            --purpose archive --codec hevc --output hdr \
            | tee build-info/convert-pq.txt
          # The plan must carry the tokens, not just the pixels.
          grep -q "master-display=G(13250,34500)" build-info/convert-pq.txt
          # And the encoder must have written them into the output bitstream.
          ffprobe -v error -select_streams v:0 -show_streams -show_frames -of json \
            "$work/pq-out.mkv" > build-info/pq-out.json
          grep -q "Mastering display metadata" build-info/pq-out.json
          grep -q '"max_content": 1000' build-info/pq-out.json

          # HDR to SDR: the tone map, the range conversion and the output tags all come from
          # the core, and the result must be tagged BT.709 rather than labelled HDR.
          "$binary" convert "$work/hlg.mkv" -o "$work/hlg-sdr.mkv" \
            --purpose archive --codec hevc --output sdr \
            | tee build-info/convert-hdr-to-sdr.txt
          grep -q "libplacebo=format=yuv444p16le:colorspace=bt709" build-info/convert-hdr-to-sdr.txt
          grep -q -- "-color_trc bt709" build-info/convert-hdr-to-sdr.txt
          ffprobe -v error -select_streams v:0 -show_streams -of json "$work/hlg-sdr.mkv" \
            > build-info/hdr-to-sdr.json
          grep -q '"codec_name": "hevc"' build-info/hdr-to-sdr.json
          # Archive keeps the 10-bit precision; only the transfer changes to BT.709.
          grep -q '"pix_fmt": "yuv420p10le"' build-info/hdr-to-sdr.json
          grep -q '"color_transfer": "bt709"' build-info/hdr-to-sdr.json

      - name: Archive app bundle
        run: tar -czf LumaRecode-arm64-app.tar.gz -C app-macos/dist LumaRecode.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            LumaRecode-arm64-app.tar.gz
            build-info/
          if-no-files-found: error
