# Builds and tests the shared core on every host, then the two delivery targets.
#
# The core job is the gate: format rules, timeline and preset parsing must pass
# on Linux, Windows and macOS before a platform artifact is produced. Hardware
# media tests stay a separate, non-blocking result because a hosted runner does
# not guarantee an encoder.
name: native

on:
  push:
    branches: [next]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path native/Cargo.toml --workspace

  docs:
    name: documentation
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates parallel language sections, anchors and links for every
      # Markdown file, including the four READMEs this branch renames.
      - name: Documentation checks
        run: python3 qa/DocumentationChecks/check_docs.py

  windows:
    name: windows (${{ matrix.arch }})
    needs: core
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: X64
            arch: x64
            rid: win-x64
            triple: x86_64-pc-windows-msvc
          - target: Arm64
            arch: arm64
            rid: win-arm64
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Add Rust target
        run: rustup target add ${{ matrix.triple }}

      - name: Build native library
        shell: pwsh
        run: |
          $test = '${{ matrix.target }}' -eq 'X64'
          ./tools/Build-Native.ps1 -Configuration Release -Target ${{ matrix.target }} -Test:$test

      - name: Build managed interop
        shell: pwsh
        run: dotnet build Interop/LumaRecode.Native.csproj -c Release -p:LumaRecodeArchitecture=${{ matrix.arch }} --nologo

      - name: Record versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-info -Force | Out-Null
          rustc -Vv | Out-File build-info/rust.txt
          dotnet --version | Out-File build-info/dotnet.txt
          (Get-FileHash "artifacts/native/${{ matrix.arch }}/lumacore.dll" -Algorithm SHA256).Hash |
            Out-File build-info/lumacore.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/native/${{ matrix.arch }}/
            build-info/
          if-no-files-found: error

  macos:
    name: macos 27 (arm64)
    needs: core
    # GitHub names macOS runner images after the Xcode major. The preview image
    # for macOS 27 is published under the label "xcode-27"; its OS is macOS
    # 27.0.1 with Xcode 27.0/27.1/27.2. There is no "macos-27" label yet, and
    # "macos-latest" resolves to macOS 26, which cannot build the 27.0
    # deployment target below. Preview images sit outside the Actions SLA, so
    # move this to the stable label once macOS 27 reaches GA.
    runs-on: xcode-27
    env:
      MACOSX_DEPLOYMENT_TARGET: "27.0"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # The image ships several Xcode builds and defaults to an older one.
          # Select the newest installed major.minor so the app is always built
          # with the latest Swift the image provides; the resolved version is
          # recorded below.
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version
          xcodebuild -version
          rustup show active-toolchain

      - name: Build, test and package
        run: bash app-macos/scripts/build-macos.sh --skip-dmg --test

      - name: Record versions and signature
        run: |
          mkdir -p build-info
          rustc -Vv > build-info/rust.txt
          swift --version > build-info/swift.txt
          codesign --verify --strict --verbose=2 app-macos/dist/LumaRecode.app 2> build-info/codesign.txt
          shasum -a 256 app-macos/dist/LumaRecode.app/Contents/MacOS/LumaRecode > build-info/lumarecode.sha256

      - name: CLI smoke
        run: |
          # The bundle executable doubles as the terminal entry point; run it
          # headless and require the same core line the Windows job checks.
          binary="app-macos/dist/LumaRecode.app/Contents/MacOS/LumaRecode"
          "$binary" --version | tee build-info/cli.txt
          grep -q "core: shared 0.1.0" build-info/cli.txt

      - name: Archive app bundle
        run: tar -czf LumaRecode-arm64-app.tar.gz -C app-macos/dist LumaRecode.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            LumaRecode-arm64-app.tar.gz
            build-info/
          if-no-files-found: error
