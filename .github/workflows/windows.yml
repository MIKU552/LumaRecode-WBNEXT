# Windows build and parity gate.
#
# Everything here runs on a hosted runner: the repository is not built or tested
# on a developer machine. The job proves three things in order — the Rust core
# builds and passes its tests on Windows, the managed layers compile against it,
# and the existing WinUI application still builds with the baseline core.
name: windows

on:
  push:
    branches: [next]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and parity (x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc -Vv
          dotnet --version
          New-Item -ItemType Directory -Path build-info -Force | Out-Null
          rustc -Vv | Out-File build-info/rust.txt
          dotnet --version | Out-File build-info/dotnet.txt

      - name: Build core and stage the native library
        shell: pwsh
        run: ./tools/Build-Native.ps1 -Configuration Release -Target X64 -Test

      - name: Restore application (locked)
        shell: pwsh
        run: dotnet restore App/VideoConverter.WinUI.csproj --locked-mode -p:Platform=x64

      - name: Build application
        shell: pwsh
        run: dotnet build App/VideoConverter.WinUI.csproj -c Release -p:Platform=x64 --no-restore

      - name: Build managed interop
        shell: pwsh
        run: |
          dotnet build Interop/LumaRecode.Native.csproj -c Release -p:LumaRecodeArchitecture=x64
          dotnet build qa/NativeChecks/NativeChecks.csproj -c Release -p:LumaRecodeArchitecture=x64

      - name: Check formatting
        shell: pwsh
        run: |
          dotnet format Interop/LumaRecode.Native.csproj --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw "Interop formatting differs." }
          dotnet format qa/NativeChecks/NativeChecks.csproj --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw "NativeChecks formatting differs." }

      - name: Parity check
        shell: pwsh
        run: |
          dotnet run --project qa/NativeChecks/NativeChecks.csproj -c Release -p:LumaRecodeArchitecture=x64 *> build-info/parity.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-info/parity.log | Select-Object -Last 60
            throw "Parity check failed."
          }
          Get-Content build-info/parity.log | Select-Object -Last 5

      - name: CLI smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path App/bin -Recurse -Filter LumaRecode.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if ($null -eq $exe) { throw "LumaRecode.exe was not built." }
          $env:LUMARECODE_DIAGNOSTICS = "1"
          # The application is a GUI-subsystem binary, so "&" neither waits nor sets
          # $LASTEXITCODE. Start it, wait, and capture the redirected streams.
          $stdout = Join-Path $env:RUNNER_TEMP "cli-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "cli-stderr.txt"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--cli', '--version' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = (Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)
          $text
          if ($process.ExitCode -ne 0) { throw "CLI --version failed with $($process.ExitCode)." }
          if ($text -notmatch 'core: shared 0\.1\.0') { throw "Shared core was not active in the host." }
          if ($text -notmatch 'LumaRecode 4\.4\.3') { throw "Unexpected version output." }

          # The fallback must work too: force the managed rules and require the
          # CLI to stay usable when the native library is deliberately ignored.
          $env:LUMARECODE_CORE = "managed"
          $managedOut = Join-Path $env:RUNNER_TEMP "cli-managed-out.txt"
          $managedErr = Join-Path $env:RUNNER_TEMP "cli-managed-err.txt"
          $managed = Start-Process -FilePath $exe.FullName -ArgumentList '--cli', '--version' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $managedOut -RedirectStandardError $managedErr
          $managedText = (Get-Content $managedOut -Raw) + (Get-Content $managedErr -Raw)
          $managedText
          if ($managed.ExitCode -ne 0) { throw "Managed fallback failed with $($managed.ExitCode)." }
          if ($managedText -notmatch 'core: managed') { throw "Managed fallback was not used." }
          Remove-Item Env:LUMARECODE_CORE

      - name: Integration smoke
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed with $LASTEXITCODE." }
          # Resolve the executable from the package directory instead of trusting the
          # shim: a cached package can report success without refreshing the shim.
          $ffmpeg = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe -ErrorAction Stop |
            Select-Object -First 1
          if ($null -eq $ffmpeg) { throw "FFmpeg was installed but not found." }
          $env:PATH = "$($ffmpeg.DirectoryName);$env:PATH"
          ffmpeg -version | Select-Object -First 1
          $source = Join-Path $env:RUNNER_TEMP "source.mp4"
          $target = Join-Path $env:RUNNER_TEMP "out.mkv"
          ffmpeg -v error -f lavfi -i testsrc2=size=320x240:rate=30:duration=2 `
            -c:v libx264 -pix_fmt yuv420p -y $source
          if ($LASTEXITCODE -ne 0) { throw "Synthetic source generation failed." }
          # Keep the raw probe document: it is the fixture the shared parser is
          # written against, including the fields ffprobe omits.
          ffprobe -v error -print_format json -show_streams -show_format $source > build-info/ffprobe-source.json
          if ($LASTEXITCODE -ne 0) { throw "Raw probe capture failed." }

          $exe = Get-ChildItem -Path App/bin -Recurse -Filter LumaRecode.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          $env:LUMARECODE_DIAGNOSTICS = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "convert-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "convert-stderr.txt"
          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList 'convert', $source, '-o', $target, '--purpose', 'archive', '--codec', 'hevc', '--input-kind', 'sdr', '--no-settings', '--accept-terms' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = (Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)
          $text
          if ($process.ExitCode -ne 0) { throw "CLI convert failed with $($process.ExitCode)." }
          if (-not (Test-Path -LiteralPath $target)) { throw "Convert did not produce the output file." }

          $probe = ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of csv=p=0 $target
          $probe
          if ($probe -notmatch '^hevc,yuv420p') { throw "Unexpected output stream: $probe" }

          $doctorOut = Join-Path $env:RUNNER_TEMP "doctor.json"
          $doctorErr = Join-Path $env:RUNNER_TEMP "doctor-err.txt"
          $doctor = Start-Process -FilePath $exe.FullName -ArgumentList 'doctor', '--json', '--no-settings', '--accept-terms' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $doctorOut -RedirectStandardError $doctorErr
          if ($doctor.ExitCode -ne 0) {
            Get-Content $doctorOut
            Get-Content $doctorErr
            throw "doctor failed with $($doctor.ExitCode)."
          }
          $report = Get-Content $doctorOut -Raw | ConvertFrom-Json
          $report.core
          if ($report.core.mode -ne 'shared') { throw "doctor did not report the shared core." }

          # Capture real probe and plan documents. They feed the shared probe parser
          # and the planning parity work, and they prove both commands run headless.
          foreach ($command in @('probe', 'plan')) {
            $out = Join-Path $env:RUNNER_TEMP "$command.json"
            $err = Join-Path $env:RUNNER_TEMP "$command-err.txt"
            $arguments = @($command, $source, '--json', '--no-settings', '--accept-terms')
            if ($command -eq 'plan') {
              $arguments += @('--purpose', 'archive', '--codec', 'hevc', '--input-kind', 'sdr')
            }
            $run = Start-Process -FilePath $exe.FullName -ArgumentList $arguments `
              -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            if ($run.ExitCode -ne 0) { Get-Content $err; throw "$command failed with $($run.ExitCode)." }
            $null = Get-Content $out -Raw | ConvertFrom-Json
            Copy-Item $out "build-info/$command.json"
            "$command ok"
          }

      - name: Record hashes
        shell: pwsh
        run: |
          (Get-FileHash "artifacts/native/x64/lumacore.dll" -Algorithm SHA256).Hash |
            Out-File build-info/lumacore.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64
          path: |
            artifacts/native/x64/
            build-info/
          if-no-files-found: warn
